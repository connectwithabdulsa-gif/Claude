[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfy-outbound-engine"
version = "0.1.0"
description = "DFY GTM Systems outbound engine. dry run by default."
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pyyaml>=6", "dnspython>=2.6", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["anthropic>=0.40"]   # only for writer_mode: api (paid). the app does not need it

[project.scripts]
engine = "engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["app/templates/*.html", "app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
