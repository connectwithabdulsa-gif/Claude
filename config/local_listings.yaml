# local business lead sourcing (roofing, medspas, chiropractors, plumbing, hvac).
#
# source: outscraper's yelp-search endpoint. api contract verified against the official
# outscraper python sdk 6.0.5 (pypi sdist/wheel, outscraper/client.py yelp_search and
# outscraper/transport.py):
#   GET https://api.app.outscraper.com/yelp-search
#   header  X-API-KEY: <key>
#   params  query (repeatable, yelp search urls, max 250 per request), limit, async,
#           fields, ui, webhook
#   >10 queries forces async: response is {id}, then poll GET /requests/{id} until
#   status != "Pending" and read .data
#
# why not yelp or google directly: both forbid storing the data. see
# docs/local-business-sourcing.md for the quoted clauses.

api:
  base_url: https://api.app.outscraper.com
  # fallbacks the sdk uses, in order. kept for reference; the client tries base_url first.
  fallback_urls:
    - https://api.app.outscraper.cloud
  key_env: OUTSCRAPER_API_KEY
  # queries sent in one http request. the sdk caps this at 250 and forces async above 10.
  queries_per_request: 50
  # records requested per single yelp search url
  limit_per_query: 50
  poll_seconds: 5
  poll_timeout_seconds: 1800

# abdul's icp filter. applied locally, because yelp search has no server side
# rating or review filter.
filters:
  min_rating: 4.0
  min_reviews: 30
  country: US
  # drop listings with no phone. a lead we cannot reach is not a lead.
  require_phone: true
  # a website is wanted but not required: plenty of good local businesses have none,
  # and we still want them for the call list.
  require_website: false

target:
  total: 2000
  # how the 2000 is split. five separate buckets, medspas kept apart from
  # chiropractors so we can measure each niche on its own (CLAUDE.md section 8).
  per_niche: 400

# set this from the outscraper dashboard before any live run, so the dry run can
# price the job. left null on purpose: do not guess a rate.
pricing:
  price_per_1000_records_usd: null
  # share of yelp listings expected to clear 4.0 stars and 30+ reviews. an assumption
  # used only to size the job; the first live run replaces it with the real number.
  assumed_qualify_rate: 0.5

niches:
  roofing:
    label: Roofing contractors
    find_desc: Roofing
  medspas:
    label: Medical spas
    find_desc: Medical Spas
  chiropractors:
    label: Chiropractors
    find_desc: Chiropractors
  plumbing:
    label: Plumbing
    find_desc: Plumbers
  hvac:
    label: Heating and air conditioning
    find_desc: Heating & Air Conditioning/HVAC

# metros are worked in this order until a niche hits its target, so the spend stops
