# Anthropic API settings. model ids and prices from the Claude API reference
# (cached 2026-10-06). re-check prices before trusting the estimate for a big batch.

writer:
  model: claude-opus-5-5
  effort: medium            # opus 5.5 default is medium. thinking is always on for this model
  max_tokens: 4000
qa:
  model: claude-opus-5-5
  effort: medium
  max_tokens: 4000
classifier:                  # phase 6, bulk reply classification
  model: claude-haiku-5-5
  effort: low
  max_tokens: 1000

# server side refusal fallback (beta). if the model declines, the api reruns the
# request on a fallback model it picks by refusal category.
fallbacks: default
fallback_beta: server-side-fallback-2026-07-01

prices_per_million:          # usd
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
  claude-haiku-5-5: {input: 0.10, output: 0.50}

# estimate assumptions (output includes thinking tokens, which are billed as output)
estimate:
  writer_output_tokens: 900
  qa_output_tokens: 700
  chars_per_token_rough: 3.5   # only used when no api key is set to count tokens properly
