# niche definitions for ICP fit scoring (CLAUDE.md section 8).
# a company matches a niche on NAICS code prefix or on keywords found in its
# industry, name or description. strong = 15 points, weak = 8 points.
# NAICS codes are the public 2017 standard.

amazon_agency:
  label: amazon agency
  plural: amazon agencies
  keywords_strong: [amazon agency, amazon seller, amazon marketing, amazon ppc, marketplace agency, ecommerce agency, e-commerce agency]
  keywords_weak: [ecommerce, e-commerce, shopify, marketing & advertising, advertising agencies, marketing agency]
  naics_weak: ["541810", "541613", "541890"]

saas:
  label: b2b saas
  plural: b2b saas founders
  keywords_strong: [saas, software as a service, b2b software]
  keywords_weak: [computer software, software development, software publishers]
  naics_weak: ["5112", "513210", "5182", "541511"]

financial:
  label: financial firm
  plural: financial firms
  keywords_strong: [mortgage broker, mortgage, wealth management, financial advisor, insurance agency, business lending, fintech]
  keywords_weak: [financial services, insurance, investment advice, lending]
  naics_strong: ["522310", "523930", "524210"]
  naics_weak: ["522291", "5239", "5242"]

recruiting:
  label: recruiting firm
  plural: recruiting firms
  keywords_strong: [recruiting, recruitment agency, staffing, executive search, talent acquisition agency]
  keywords_weak: [staffing & recruiting, employment services, human resources services]
  naics_strong: ["561311", "561312", "561320"]
  naics_weak: ["5613"]

msp:
  label: msp
  plural: msps
  keywords_strong: [managed service provider, managed it, msp, it support services, managed security]
  keywords_weak: [it services, information technology & services, computer systems design]
  naics_strong: ["541513"]
  naics_weak: ["541512", "541519"]

freight:
  label: freight brokerage
  plural: freight brokerages
  keywords_strong: [freight broker, freight brokerage, 3pl, third party logistics, freight forwarding]
  keywords_weak: [logistics & supply chain, transportation, trucking, logistics]
  naics_strong: ["488510"]
  naics_weak: ["4841", "4842"]
